name: Spec Meta

on:
  push:
    branches: [ main ]
    paths:
      - 'PROTOCOL.md'
      - 'ARCHITECTURE.md'
      - 'THE_ORANGE_PAPER.md'
      - 'scripts/spec-meta.mjs'
      - 'SPEC_META.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'PROTOCOL.md'
      - 'ARCHITECTURE.md'
      - 'THE_ORANGE_PAPER.md'
      - 'scripts/spec-meta.mjs'
      - 'SPEC_META.json'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-spec-meta:
    name: Update SPEC_META.json
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, builds]

    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch all tags so git describe resolves correctly
          fetch-depth: 0
          # Credentials for the release-branch push. The generated file is a pull
          # request, not a commit on main. Falls back to GITHUB_TOKEN.
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Generate SPEC_META.json
        run: node scripts/spec-meta.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet SPEC_META.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated SPEC_META.json
        if: steps.diff.outputs.changed == 'true'
        env:
          PR_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SPEC_META.json
          git commit -m "chore: update SPEC_META.json [skip ci]"
          BRANCH="release/spec-meta-${GITHUB_SHA}"
          case "${GITHUB_REF}" in
            refs/heads/*) BASE="${GITHUB_REF_NAME}" ;;
            *) BASE=main ;;
          esac
          git push origin "HEAD:${BRANCH}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          PAYLOAD=$(printf '{"title":"chore: update SPEC_META.json [skip ci]","head":"%s","base":"%s","body":"SPEC_META.json was regenerated from the spec sources. This pull request records that file on main. The pull request job only checks it."}' "${BRANCH}" "${BASE}")
          CODE=$(curl -sS -o /tmp/spec-meta-pr.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${PR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            -d "${PAYLOAD}")
          if [ "${CODE}" != "201" ]; then
            echo "::error::SPEC_META.json is on ${BRANCH} but the pull request was not opened (HTTP ${CODE})"
            exit 1
          fi
          echo "Opened pull request for ${BRANCH}"

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "SPEC_META.json is already up to date."

  verify-spec-meta:
    name: Verify SPEC_META.json (PRs)
    runs-on: [self-hosted, Linux, X64, builds]

    # On PRs only — verify the file is not stale without auto-committing
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verify SPEC_META.json is up to date
        run: node scripts/spec-meta.mjs --verify
